<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotec - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="shortcut icon" href="../imgs/Icone - Bibliotec.png" type="image/x-icon">
</head>

<body>
    <main class="conteudo">
        <article class="Apresentacao-login">
            <img src="../imgs/music_hub_escrita.png" alt="MusicHub">
            <h1>Acesse sua conta para utilizar todos os nossos recursos</h1>
            <p>Para uma experiência mais completa conheça nossos planos pagos.</p>
        </article>
        <section class="login">
            
            <div class="img-cabecalho">
                <img src="../imgs/music_hub_icone.png" alt="Logo MusicHub">
            </div>

            <form>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="email@alunosenai.com">
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo">
                        <input type="password" id="senha" placeholder="********">
                        <button type="button" id="mostrar-senha" class="botao-olho">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                        <span>Esqueceu sua senha?</span>
                    </div>
                </div>

                <button type="submit" class="botao-entrar">Continuar</button>

                <p class="ou">ou logue-se com</p>

                <button class="botao-google">
                    <img src="../imgs/flat-color-icons_google.svg" alt="Logo google">
                    <span>Continuar com Google</span>
                </button>

            </form>
        </section>
    </main>
    <script src="login.js"></script>
</body>

</html>
