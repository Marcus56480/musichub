<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub</title>
    <link rel="stylesheet" href="cadastrar.css">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>

<body class="pagina-perfil">
    <aside class="menu-lateral">
        <div class="topo-menu">
            <button class="botao-voltar">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

        </div>
        <nav class="menu-navegacao">
            <img src="/imgs/IconeMusicHub_Transparente_4.svg" alt="">

            <a href="#" class="item-menu">
                <i class="fa-regular fa-bookmark"></i>
                <span>Cadastrar Artista</span>
            </a>

            <a href="#" class="item-menu">
                <i class="fa-solid fa-headphones"></i>
                <span>Cadastrar Musica</span>
            </a>

            <a href="#" class="item-menu">
                <i class="fa-brands fa-napster"></i>
                <span>FAVORITOS</span>
            </a>
        </nav>

        <!-- Sair -->
        <a href="#" class="botao-sair">
            <i class="fa-solid fa-up-right-from-square"></i>
            <span>SAIR</span>
        </a>
    </aside>


    <main class="conteudo-perfil">
        <section class="cabecalho-perfil">
            <h1>Cadastrar Artista</h1>
            <p>Preencha as informaçoes para cadastrar um novo artista</p>
        </section>

        <!-- Card-Principal -->
        <!-- <section class="card-perfil"> -->

        <!-- <div class="area-busca"> -->


        <section class="container card">


            <article class="input-cadastrar1">
                <h2 class="titulo-input">Nome</h2>
                <div class="campo-busca">
                    <input type="text" placeholder="Ex:Bring Me the Horizon">
                </div>
                <h2 class="titulo-input">Membros</h2>
                <div class="campo-busca">
                    <input type="text" placeholder="Ex:Oliver Skyes">
                </div>
                <h2 class="titulo-input">Gravadora</h2>
                <div class="campo-busca">
                    <input type="text" placeholder="Ex:Columbia Records">
                </div>


            </article>


            <article class="input-cadastrar2">
                <h2>Fotos da Capa</h2>
                <div class="campo-busca">
                    <input type="text" placeholder="Escolha um Arquivo">
                </div>
                <h2>Idioma</h2>
                <div class="campo-busca">
                    <input type="text" placeholder="Ex:Português">
                </div>
                <h2>Gênero musical</h2>
                <div class="campo-busca">
                    <input type="text" placeholder="Selecione uma categoria">
                </div>


            </article>
            
            <div class="campo-busca-descricao">
                <input type="text" placeholder="Escreva uma breve descrição sobre o artista">
            </div>
            <div class="btn">
                <a href="" class="botao">Salvar</a>
            </div>



        </section>



        <!-- </div> -->

        <!-- </section> -->
    </main>



</body>

</html>
