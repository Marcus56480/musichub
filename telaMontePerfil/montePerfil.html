<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub</title>
    <link rel="stylesheet" href="montePerfil.css">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>

<body class="pagina-perfil">
    <aside class="menu-lateral">
        <div class="topo-menu">
            <button class="botao-voltar">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

        </div>
        <nav class="menu-navegacao">
            <img src="/imgs/IconeMusicHub_Transparente_4.svg" alt="">

            <a href="#" class="item-menu">
                <i class="fa-regular fa-bookmark"></i>
                <span>Músicas Salvas</span>
            </a>

            <a href="#" class="item-menu">
                <i class="fa-solid fa-headphones"></i>
                <span>Sua Playlist</span>
            </a>

        </nav>

        <!-- Sair -->
        <a href="#" class="botao-sair">
            <i class="fa-solid fa-up-right-from-square"></i>
            <span>SAIR</span>
        </a>
    </aside>


    <main class="conteudo-perfil">
        <section class="cabecalho-perfil">
            <h1>Monte sua playlist</h1>
            <p>Salve suas músicas e ouça quando quiser</p>
        </section>

        <!-- Card-Principal -->
        <section class="card-perfil">

            <div class="area-busca">
                <img src="/imgs/fotoperfil01.png" class="img-perfil" alt="fotoPerfil">
        
                <h2>Digite seusDados</h2>
                <div class="campo-busca">
                    <input type="text" placeholder="Digite música ou artista favorito..">
                    
                </div>

                <div class="btn">
                 <a href="" class="botao">Salvar</a>
                </div>

            </div>
            </div>
        </section>
    </main>



</body>

</html>
