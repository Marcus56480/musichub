<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub | Detalhes-Artista</title>

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="artista.css">
    <link rel="shortcut icon" href="../imgs/Logo-Transparente.svg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <main>
        <section class="artista">

            <a class="sair">
                <i class="fa-solid fa-angle-left"></i>
            </a>
            
            <article class="perfil">
                <img src="../imgs/travis-perfil.svg" alt="">
                <h1>Travis Scott</h1>
            </article>

            <article class="Travis">
                <img src="../imgs/Travis Scott.svg" alt="">
            </article>
        </section>

        <section class="ultimo-lancamento">
            <h2>Último Lançamento</h2>
            <article class="capa-album card">
                <img src="../imgs/The-odyssey.svg" alt="">

                <div class="card" id="card">
                    <h2>When i´m Home</h2>
                </div>
            </article>
        </section>

        <section class="populares">
            <h2>Populares</h2>

            <article class="infos-musica card">
                <h2>1</h2>
                <a href="#"><img src="../imgs/goosebumps.svg" alt=""></a>
                <a id="nome" href="#">Goosebumps</a>
                <p>4:03</p>
            </article>

            <article class="infos-musica card">
                <h2>2</h2>
                <a href="#"><img src="../imgs/fein.svg" alt=""></a>
                <a href="#" id="nome">FE!N(feat. Playboi carti)</a>
                <p>3:11</p>
            </article>

            <article class="infos-musica card">
                <h2>3</h2>
                <a href="#"><img src="../imgs/sicko-mode.svg" alt=""></a>
                <a href="#" id="nome">sicko mode</a>
                <p>5:12</p>
            </article>

            <article class="infos-musica card">
                <h2>4</h2>
                <a href="#"><img src="../imgs/highest.svg" alt=""></a>
                <a href="#" id="nome">highest in the room</a>
                <p>2:55</p>
            </article>

            <article class="infos-musica card">
                <h2>5</h2>
                <a href="#"><img src="../imgs/YOU.svg" alt=""></a>
                <a href="#" id="nome"><span>you</span> (feat. Travis Scott)</a>
                <p>4:03</p>
            </article>
        </section>

        <section class="principais-albuns">
            <article class="albuns">
                <h2>Principais Álbuns</h2>
                <div class="carrosel-pai">
                    <div class="carrosel">
                        <a href="#">
                            <img src="../imgs/jackboys.svg" alt="">
                        </a>
                    </div>

                    <div class="carrosel">
                        <a href="#">
                            <img src="../imgs/fein-2.svg" alt="">
                        </a>
                    </div>

                    <div class="carrosel">
                        <a href="#">
                            <img src="../imgs/jackboys2.svg" alt="">
                        </a>
                    </div>

                    <div class="carrosel">
                        <a href="#">
                            <img src="../imgs/sicko-mode-2.svg" alt="">
                        </a>
                    </div>

                    <div class="carrosel">
                        <a href="#">
                            <img src="../imgs/Huncho-jack.svg" alt="">
                        </a>
                    </div>

                    <div class="carrosel">
                        <a href="#">
                            <img src="../imgs/birds-in-the-trap.svg" alt="">
                        </a>
                    </div>

                    <div class="carrosel">
                        <a href="#">
                            <img src="../imgs/rodeo.svg" alt="">
                        </a>
                    </div>

                    <div class="carrosel">
                        <a href="#">
                            <img src="../imgs/days-before-rodeo.svg" alt="">
                        </a>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>

</html>
