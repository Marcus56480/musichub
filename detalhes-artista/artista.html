<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub | Detalhes-Artista</title>

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="artista.css">
    <link rel="shortcut icon" href="../imgs/Logo-Transparente.svg" type="image/x-icon">
</head>

<body>
    <main>
        <section class="artista">
            <article class="perfil">
                <img src="../imgs/travis-perfil.svg" alt="">
                <h1>Travis Scott</h1>
            </article>

            <article class="Travis">
                <img src="../imgs/Travis Scott.svg" alt="">
            </article>
        </section>

        <section class="ultimo-lancamento">
            <h2>Último Lançamento</h2>
            <article class="capa-album card">
                <img src="../imgs/The-odyssey.svg" alt="">

                <div class="card" id="card">
                    <h2>When i´m Home</h2>
                </div>
            </article>
        </section>

        <section class="populares">
            <h2>Populares</h2>

            <article class="infos-musica card">
                <h2>1</h2>
                <img src="../imgs/goosebumps.svg" alt="">
                <p id="nome">Goosebumps</p>
                <p>4:03</p>
            </article>

            <article class="infos-musica card">
                <h2>2</h2>
                <img src="../imgs/fein.svg" alt="">
                <p id="nome">FE!N(feat. Playboi carti)</p>
                <p>3:11</p>
            </article>

            <article class="infos-musica card">
                <h2>3</h2>
                <img src="../imgs/sicko-mode.svg" alt="">
                <p id="nome">sicko mode</p>
                <p>5:12</p>
            </article>

            <article class="infos-musica card">
                <h2>4</h2>
                <img src="../imgs/highest.svg" alt="">
                <p id="nome">highest in the room</p>
                <p>2:55</p>
            </article>

            <article class="infos-musica card">
                <h2>5</h2>
                <img src="../imgs/YOU.svg" alt="">
                <p id="nome"><span>you</span> (feat. Travis Scott)</p>
                <p>4:03</p>
            </article>
        </section>

        <section class="principais-albuns">
            <article class="albuns">
                <h2>Principais Álbuns</h2>
                <div class="carrosel-pai">
                    <div class="carrosel">
                        <img src="../imgs/jackboys.svg" alt="">
                    </div>

                    <div class="carrosel">
                        <img src="../imgs/fein-2.svg" alt="">
                    </div>

                    <div class="carrosel">
                        <img src="../imgs/jackboys2.svg" alt="">
                    </div>

                    <div class="carrosel">
                        <img src="../imgs/sicko-mode-2.svg" alt="">
                    </div>

                    <div class="carrosel">
                        <img src="../imgs/Huncho-jack.svg" alt="">
                    </div>

                    <div class="carrosel">
                        <img src="../imgs/birds-in-the-trap.svg" alt="">
                    </div>

                    <div class="carrosel">
                        <img src="../imgs/rodeo.svg" alt="">
                    </div>

                    <div class="carrosel">
                        <img src="../imgs/days-before-rodeo.svg" alt="">
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>

</html>
