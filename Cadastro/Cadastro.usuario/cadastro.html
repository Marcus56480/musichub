<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Hub — Cadastro</title>
    <link rel="stylesheet" href="cadastro.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="container">

        <!-- Lado esquerdo: formulário -->
        <section class="form-card">
            <div class="logo-topo">
                <img src="../../imgs/logo.cadastro.svg" alt="Music Hub" />
            </div>

            <h1>SEJA BEM-VINDO</h1>

            <form id="form-cadastro">
                <label for="nome">NOME COMPLETO</label>
                <input type="text" id="nome" placeholder="Digite seu Nome" required />

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="email@gmail.com" required />

                <label for="telefone">TELEFONE</label>
                <input type="tel" id="telefone" placeholder="+55 (  ) ____-____" required />

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="___.___.___-__" required />

                <button type="submit">CONTINUAR</button>
            </form>
        </section>

        <!-- Lado direito: apresentação -->
        <section class="apresentacao">
            <img src="../../imgs/IconeMusicHub_Transparente_vertical2.svg" alt="Music Hub" class="logo-lateral" />
            <h2>Seja Bem Vindo!</h2>
            <p>Crie uma conta para acessar todos os nosso benefícios</p>
        </section>

    </main>

    <script src="cadastro.js"></script>
</body>

</html>
