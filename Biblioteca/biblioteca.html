<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Music Hub — Sua biblioteca musical" />
  <meta property="og:title" content="Music Hub" />
  <meta property="og:image" content="../imgs/preview.jpg" />
  <title>Music Hub — Biblioteca</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="biblioteca.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="../imgs/favicon.ico" />
</head>

<body>

  <div class="bolha-3"></div>
  <div class="app">
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="../imgs/IconeMusicHub 1.svg" alt="Music Hub" />
      </div>

      <ul class="sidebar-avatares">
        <li>
          <img src="../imgs/imagens. biblioteca/Carrossel.Vertical.jpg" alt="Travis Scott" />
          <span>Travis Scott</span>
        </li>
        <li>
          <img src="../imgs/imagens. biblioteca/Carrossel.Vertical (2).jpg" alt="Joji" />
          <span>Joji</span>
        </li>
        <li>
          <img src="../imgs/imagens. biblioteca/Carrossel.Vertical (3).jpg" alt="Frank Ocean" />
          <span>Frank Ocean</span>
        </li>
        <li>
          <img src="../imgs/imagens. biblioteca/Carrossel.Vertical (4).jpg" alt="Charlie Brown" />
          <span>Charlie Brown</span>
        </li>
        <li>
          <img src="../imgs/imagens. biblioteca/Carrossel.Vertical (5).jpg" alt="Sabotage" />
          <span>Sabotage</span>
        </li>
        <li>
          <img src="../imgs/imagens. biblioteca/Carrossel.Vertical (6).jpg" alt="Tyler, the Creator" />
          <span>Tyler, the Creator</span>
        </li>
        <li>
          <img src="../imgs/imagens. biblioteca/Carrossel.Vertical(7).jpg" alt="Rita Lee" />
          <span>Rita Lee</span>
        </li>
        <li>
          <img src="../imgs/imagens. biblioteca/Carrossel.Vertical(8).jpg" alt="Lauryn Hill" />
          <span>Lauryn Hill</span>
        </li>
      </ul>
    </aside>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <main class="conteudo">
      <div class="topo">
        <input type="search" class="busca" placeholder="Pesquisar artistas, músicas, álbuns..." />
      </div>

      <div class="pagina-header">
        <h1>Sua Biblioteca</h1>
        <p>126 músicas • 18 episódios • 12 playlists salvas</p>
      </div>

      <nav class="filtros">
        <button class="filtro ativo" data-filtro="playlists">PLAYLISTS</button>
        <button class="filtro" data-filtro="downloads">DOWNLOADS</button>
        <button class="filtro" data-filtro="podcasts">PODCASTS</button>
        <button class="filtro" data-filtro="musicas">MÚSICAS</button>
        <button class="filtro" data-filtro="episodios">EPISÓDIOS</button>
        <button class="filtro" data-filtro="albuns">ÁLBUNS</button>
      </nav>

    
      <div id="conteudo-categoria"></div>
    </main>
  </div>

  <!-- ===== PLAYER FIXO ===== -->
<footer class="player">
  <div class="player-info">
    <div class="player-capa">
      <img src="../imgs/imagens. biblioteca/Carrossel.Vertical (3).jpg" alt="" />
      <span class="tocando">
        <span class="barra"></span>
        <span class="barra"></span>
        <span class="barra"></span>
      </span>
    </div>
    <div>
      <strong>Frank Ocean</strong>
      <span>Tocando agora</span>
    </div>
  </div>

  <div class="player-centro">
    <div class="player-controles">
      <button>⏮</button>
      <button class="play-principal">▶</button>
      <button>⏭</button>
    </div>

    <div class="player-progresso">
      <span>0:00</span>
      <input type="range" min="0" max="100" value="0" />
      <span>0:00</span>
    </div>
  </div>

  <div class="player-volume">
    <span>🔊</span>
    <input type="range" min="0" max="100" value="80" />
  </div>
</footer>

  <script src="dados.js"></script>
  <script src="biblioteca.js"></script>
  
</body>
</html>
